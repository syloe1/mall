basePath: /api/v1
definitions:
  dto.AddressCreateReq:
    properties:
      city:
        type: string
      detail:
        type: string
      district:
        type: string
      is_default:
        type: boolean
      phone:
        type: string
      postal_code:
        type: string
      province:
        type: string
      receiver_name:
        type: string
    required:
    - city
    - detail
    - district
    - phone
    - province
    - receiver_name
    type: object
  dto.AddressDeleteReq:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  dto.AddressSetDefaultReq:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  dto.AddressUpdateReq:
    properties:
      city:
        type: string
      detail:
        type: string
      district:
        type: string
      id:
        description: ID：地址 ID （必填，要知道改哪个地址）
        type: integer
      is_default:
        type: boolean
      phone:
        type: string
      postal_code:
        type: string
      province:
        type: string
      receiver_name:
        type: string
    required:
    - city
    - detail
    - district
    - id
    - phone
    - province
    - receiver_name
    type: object
  dto.AuthTokensResponse:
    properties:
      access_token:
        description: "access_token：接口鉴权\n\t\trefresh_token：刷新登录\n\t\trole：角色（user/admin）"
        type: string
      refresh_token:
        type: string
      role:
        type: string
    type: object
  dto.CartCheckedAllReq:
    properties:
      checked:
        type: boolean
    type: object
  dto.CartItemAddReq:
    properties:
      product_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  dto.CartItemCheckedReq:
    properties:
      checked:
        type: boolean
      product_id:
        type: integer
    required:
    - product_id
    type: object
  dto.CartItemDeleteReq:
    properties:
      product_id:
        type: integer
    required:
    - product_id
    type: object
  dto.CartItemUpdateReq:
    properties:
      product_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.FavoriteCheckReq:
    properties:
      product_id:
        type: integer
    required:
    - product_id
    type: object
  dto.FavoriteFolderCreateReq:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.FavoriteFolderDeleteReq:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  dto.FavoriteFolderUpdateReq:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  dto.FavoriteItemAddReq:
    properties:
      folder_id:
        type: integer
      product_id:
        type: integer
    required:
    - folder_id
    - product_id
    type: object
  dto.FavoriteItemDeleteReq:
    properties:
      folder_id:
        type: integer
      product_id:
        type: integer
    required:
    - folder_id
    - product_id
    type: object
  dto.FavoriteItemListReq:
    properties:
      folder_id:
        type: integer
      page:
        minimum: 0
        type: integer
      page_size:
        minimum: 0
        type: integer
    required:
    - folder_id
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.OrderBuyNowReq:
    properties:
      address_id:
        type: integer
      product_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - address_id
    - product_id
    - quantity
    type: object
  dto.OrderCreateFromCartReq:
    properties:
      address_id:
        type: integer
    required:
    - address_id
    type: object
  dto.PaymentCreateReq:
    properties:
      channel:
        type: string
      order_id:
        type: integer
      pay_password:
        type: string
    required:
    - channel
    - order_id
    type: object
  dto.PaymentMockSuccessReq:
    properties:
      payment_no:
        type: string
    required:
    - payment_no
    type: object
  dto.ProductCreateReq:
    properties:
      category_id:
        type: integer
      description:
        type: string
      images:
        items:
          type: string
        type: array
      name:
        type: string
      price_cents:
        minimum: 1
        type: integer
      status:
        type: string
      stock:
        minimum: 0
        type: integer
    required:
    - category_id
    - name
    - price_cents
    type: object
  dto.ProductDeleteReq:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  dto.ProductUpdateReq:
    properties:
      category_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      images:
        items:
          type: string
        type: array
      name:
        type: string
      price_cents:
        minimum: 1
        type: integer
      status:
        type: string
      stock:
        minimum: 0
        type: integer
    required:
    - category_id
    - id
    - name
    - price_cents
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.SeckillInitStockReq:
    properties:
      activity_id:
        type: integer
    required:
    - activity_id
    type: object
  dto.SetPayPasswordRequest:
    properties:
      pay_password:
        minLength: 6
        type: string
    required:
    - pay_password
    type: object
  dto.UpdateUserRequest:
    properties:
      avatar:
        type: string
      nickname:
        type: string
    type: object
  dto.UserAmountResponse:
    properties:
      amount:
        type: string
    type: object
  mall_pkg_core.Response:
    properties:
      code:
        type: integer
      data: {}
      error: {}
      msg:
        type: string
    type: object
host: localhost:3333
info:
  contact: {}
  description: 商城后端接口文档，包含用户、商品、购物车、订单、支付、秒杀等模块。
  title: Mall 电商系统 API
  version: "1.0"
paths:
  /admin/dead-letters/products:
    get:
      consumes:
      - application/json
      description: 查询商品事件处理失败的死信记录
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 来源(publisher/consumer)
        in: query
        name: source
        type: string
      - description: 事件类型
        in: query
        name: event_type
        type: string
      - description: 商品ID
        in: query
        name: product_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 商品死信列表（管理员）
      tags:
      - 管理员
  /admin/products:
    get:
      consumes:
      - application/json
      description: 后台分页查询商品列表（含下架）
      parameters:
      - description: 页码，从 1 开始
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 状态：on_sale/off_sale/draft
        in: query
        name: status
        type: string
      - description: 分类 ID
        in: query
        name: category_id
        type: integer
      - description: 商品名称关键字
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 商品管理列表（管理员）
      tags:
      - 管理员
    post:
      consumes:
      - application/json
      description: 后台创建商品
      parameters:
      - description: 商品信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ProductCreateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 创建商品（管理员）
      tags:
      - 管理员
  /admin/products/detail:
    delete:
      consumes:
      - application/json
      description: 后台删除商品及关联图片
      parameters:
      - description: 商品ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ProductDeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 删除商品（管理员）
      tags:
      - 管理员
    put:
      consumes:
      - application/json
      description: 后台更新商品信息
      parameters:
      - description: 商品信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ProductUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 更新商品（管理员）
      tags:
      - 管理员
  /admin/products/reindex:
    post:
      description: 以 MySQL 为准，全量重建 Meilisearch 商品索引（数据补偿/对账）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 重建搜索索引（管理员）
      tags:
      - 管理员
  /admin/seckill/activities/init-stock:
    post:
      consumes:
      - application/json
      description: 将秒杀活动商品库存加载到 Redis
      parameters:
      - description: 活动ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SeckillInitStockReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 初始化秒杀库存（管理员）
      tags:
      - 管理员
  /products:
    get:
      consumes:
      - application/json
      description: 分页 + 分类 + 关键词查询上架商品
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 分类ID
        in: query
        name: category_id
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      summary: 商品列表（公开）
      tags:
      - 商品
  /products/{id}:
    get:
      consumes:
      - application/json
      description: 根据商品 ID 查询上架商品详情
      parameters:
      - description: 商品ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: 无效的商品ID
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "404":
          description: 商品不存在或已下架
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      summary: 商品详情（公开）
      tags:
      - 商品
  /products/search:
    get:
      consumes:
      - application/json
      description: 按关键词搜索上架商品
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - description: 分类ID
        in: query
        name: category_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      summary: 搜索商品（公开）
      tags:
      - 商品
  /seckill/activities:
    get:
      description: 返回当前进行中 / 未开始的秒杀活动（公开接口，无需登录）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      summary: 秒杀活动列表
      tags:
      - 秒杀
  /seckill/activities/{activity_id}/buy:
    post:
      consumes:
      - application/json
      description: 参与指定活动的秒杀，需要 JWT 认证，接口有令牌桶限流
      parameters:
      - description: 秒杀活动ID
        in: path
        name: activity_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{\"status\":\"queued\"}'
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 秒杀抢购
      tags:
      - 秒杀
  /seckill/activities/{activity_id}/my-result:
    get:
      description: 登录后查询当前用户在某活动是否抢到（前端轮询用）；未抢到返回 data=null
      parameters:
      - description: 秒杀活动ID
        in: path
        name: activity_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      summary: 查询我的抢购结果
      tags:
      - 秒杀
  /users/addresses:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 地址ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddressDeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 删除地址
      tags:
      - 地址
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 地址列表
      tags:
      - 地址
    post:
      consumes:
      - application/json
      parameters:
      - description: 地址信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddressCreateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 新增地址
      tags:
      - 地址
    put:
      consumes:
      - application/json
      parameters:
      - description: 地址信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddressUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 更新地址
      tags:
      - 地址
  /users/addresses/default:
    put:
      consumes:
      - application/json
      parameters:
      - description: 地址ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AddressSetDefaultReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 设为默认地址
      tags:
      - 地址
  /users/addresses/detail:
    get:
      consumes:
      - application/json
      parameters:
      - description: 地址ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
      summary: 地址详情
      tags:
      - 地址
  /users/cart:
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/mall_pkg_core.Response'
      security:
      - BearerAuth: []
