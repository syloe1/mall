# =============================================================================
# Mall API — Nginx 反向代理
# 静态资源 /static/       → Nginx 直接返回（不走 Go）
# API + Swagger           → 代理到 web:3333
# 秒杀接口                → 限流 + 代理
# 有前端后：location / 拆分为 /api/ (代理) + / (前端静态文件)
# =============================================================================

upstream mall_api {
    server web:3333;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    #http://公网IP/static/xxx.jpg/css/js：Nginx 自己找文件
    #返回，完全不经过 Go 程序
    # ── 静态资源：Nginx 直接返回，不走 Go ──────────────────────────
    location /static/ {
        root /app;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── 秒杀接口：额外一层限流 ────────────────────────────────────
    #单 IP 瞬时最多 30 个并发，超了直接返回 429 拒绝访问
    location /api/v1/seckill/ {
        limit_req zone=seckill burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://mall_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API + Swagger：代理到 Go ──────────────────────────────────
    location / {
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://mall_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

